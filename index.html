<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakdown To Do</title>
<style>
  @font-face{font-family:"Breakdown Task";src:url("Pretendard-Medium.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap;}
  :root{
    --bg:#f4f1ea;
    --card:#ffffff;
    --ink:#2e2b26;
    --sub:#8a8478;
    --line:#e6e1d6;
    --accent:#5b7fdb;
    --accent-soft:#e8edfb;
    --green:#4c9a6a;
    --green-soft:#e6f4ea;
    --yellow:#c98a2e;
    --yellow-soft:#fbf0dd;
    --blue:#3f7fc1;
    --blue-soft:#e6f0fa;
    --red:#c1543f;
    --red-soft:#faeae7;
    --purple:#7a6bbf;
    --purple-soft:#efeaf9;
    --teal:#3d9488;
    --teal-soft:#e2f3f0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:20px 16px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:18px;
  }
  .topbar h1{font-size:20px;font-weight:700;margin:0;}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .save-note{font-size:12px;color:var(--sub);margin-right:4px;}

  .columns{
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:16px;
    align-items:start;
  }
  @media (max-width:900px){ .columns{grid-template-columns:1fr;} }

  .col-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;}
  .col-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;}
  .col-title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .col-title.proj .dot{background:var(--purple);}

  /* 진행중 프로젝트 헤더 */
  .active-proj-head{margin-bottom:12px;}
  .active-proj-name{font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .active-proj-name .pct{font-size:14px;color:var(--accent);font-weight:700;}
  .pbar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:7px;}
  .pfill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s;}

  /* 탭 */
  .tabs{
    display:flex;gap:6px;margin-bottom:14px;background:var(--bg);
    padding:5px;border-radius:12px;border:1px solid var(--line);
  }
  .tab-btn{
    flex:1;padding:9px 4px;border:none;border-radius:9px;background:transparent;
    color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .tab-btn.active{background:var(--accent);color:#fff;}
  .panel{display:none;}
  .panel.active{display:block;}

  /* 입력/버튼 */
  .add-row{display:flex;gap:6px;margin-bottom:12px;}
  .add-row input[type=text]{
    flex:1;padding:11px;font-size:14px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);min-width:0;
  }
  .add-row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{
    padding:10px 12px;font-size:13px;font-weight:600;border:none;
    border-radius:10px;cursor:pointer;white-space:nowrap;
  }
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--accent-soft);color:var(--accent);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-neutral{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
  /* 리스트 트리 */
  .task-list{display:flex;flex-direction:column;gap:6px;}
  .task-row{
    display:flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 8px;
  }
  .task-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);cursor:pointer;}
  .task-row .task-text{
    flex:1;border:none;background:transparent;font-size:14px;color:var(--ink);
    padding:4px 3px;border-radius:6px;min-width:0;
  }
  .task-row .task-text:focus{outline:2px solid var(--accent);background:#fff;}
  .np-badge{
    flex-shrink:0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:var(--teal-soft);color:var(--teal);
  }
  .empty-msg{text-align:center;color:var(--sub);padding:26px 8px;font-size:13px;line-height:1.6;}

  /* 드래그 핸들 & 행 삭제 */
  .drag-handle{
    cursor:grab;color:var(--sub);font-size:13px;letter-spacing:-1px;
    flex-shrink:0;padding:2px 3px;user-select:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .task-row .drag-handle{touch-action:none;-webkit-touch-callout:none;}
  .task-row.dragging,.proj-row.dragging{opacity:.4;}
  .task-row.drag-over,.proj-row.drag-over{border-color:var(--accent);background:var(--accent-soft);}
  .row-delete{
    flex-shrink:0;border:none;background:transparent;color:var(--sub);
    font-size:16px;line-height:1;cursor:pointer;padding:3px 7px;border-radius:6px;
    opacity:0;transition:opacity .15s,color .15s,background .15s;
  }
  .task-row:hover .row-delete{opacity:1;}
  .row-delete:hover{color:var(--red);background:var(--red-soft);}

  /* 진행 프로젝트 선택 드롭다운 */
  .proj-select{
    width:100%;padding:11px;font-size:15px;font-weight:700;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;
  }
  .proj-select:focus{outline:2px solid var(--accent);}

  /* 실행 탭 */
  .execute-card{text-align:center;padding:16px 8px;}
  .execute-progress{font-size:12px;color:var(--sub);margin-bottom:6px;}
  .execute-path{font-size:12px;color:var(--sub);margin-bottom:4px;word-break:break-word;}
  .execute-task-text{font-size:19px;font-weight:700;line-height:1.5;margin:8px 0 18px;word-break:break-word;}
  .execute-actions{display:grid;grid-template-columns:1fr;gap:8px;text-align:left;}
  .act-btn{
    padding:12px 14px;border-radius:12px;border:none;cursor:pointer;
    font-size:14px;font-weight:700;line-height:1.35;
    display:flex;align-items:baseline;gap:8px;
  }
  .act-btn small{font-weight:400;font-size:12px;opacity:.8;}
  .act-a{background:var(--green-soft);color:var(--green);}
  .act-b{background:var(--yellow-soft);color:var(--yellow);}
  .act-c{background:var(--blue-soft);color:var(--blue);}
  .act-d{background:var(--purple-soft);color:var(--purple);}
  .act-e{background:var(--teal-soft);color:var(--teal);}
  .act-f{background:var(--red-soft);color:var(--red);}
  .act-btn:active{transform:scale(0.99);}
  .celebrate{font-size:15px;color:var(--sub);padding:34px 10px;}

  /* 히스토리 트리 */
  [data-local-id="historyView"]{max-height:min(68vh,640px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:6px;}
  .h-group{margin:3px 0;}
  .h-group>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:6px;padding:4px 0;}
  .h-group>summary::-webkit-details-marker{display:none;}
  .h-group>summary:before{content:"▸";color:var(--sub);flex-shrink:0;}
  .h-group[open]>summary:before{content:"▾";}
  .h-group>summary .h-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .h-node .h-text{min-width:0;overflow-wrap:anywhere;}
  .h-meta{font-size:11px;color:var(--sub);flex-shrink:0;}
  .h-more{display:block;margin:10px auto;}
  .h-full-text{white-space:pre-wrap;overflow-wrap:anywhere;padding:6px 0;}
  .h-tree{font-size:13.5px;line-height:1.7;}
  .h-node{display:flex;align-items:baseline;gap:6px;padding:2px 0;word-break:break-word;}
  .h-node .h-time{font-size:11px;color:var(--sub);flex-shrink:0;}
  .h-node.h-gaveup .h-text{color:var(--sub);}
  .h-node.h-done .h-text{color:var(--sub);text-decoration:line-through;}
  .h-children{margin-left:20px;border-left:2px solid var(--line);padding-left:10px;}
  .h-insert-title{
    font-size:13px;font-weight:700;color:var(--teal);
    margin:16px 0 6px;padding-top:12px;border-top:1px dashed var(--line);
  }

  /* 프로젝트 관리 */
  .proj-row{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;margin-bottom:7px;cursor:pointer;
  }
  .proj-row.active{background:var(--purple-soft);border-color:var(--purple);}
  .proj-row .proj-name{
    flex:1;border:none;background:transparent;font-size:14px;font-weight:600;
    color:var(--ink);padding:4px 3px;border-radius:6px;min-width:0;cursor:text;
  }
  .proj-row .proj-name:focus{outline:2px solid var(--purple);background:#fff;}
  .proj-row .proj-pct{font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0;width:38px;text-align:right;}
  .proj-row .btn{padding:6px 9px;font-size:12px;}
  .proj-pbar{height:5px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:5px;}
  .proj-hint{font-size:12px;color:var(--sub);margin:0 0 10px;line-height:1.5;}

  /* 오버레이 */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(30,28,24,.5);
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .overlay.active{display:flex;}
  .overlay-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:480px;}
  .overlay-box h2{font-size:16px;margin:0 0 6px;}
  .overlay-box p.hint{font-size:13px;color:var(--sub);margin:0 0 12px;}
  .overlay-box textarea{
    width:100%;min-height:140px;padding:12px;font-size:15px;font-family:inherit;
    border:1px solid var(--line);border-radius:10px;resize:vertical;line-height:1.6;
  }
  .overlay-box textarea:focus{outline:2px solid var(--accent);}
  .overlay-actions{display:flex;gap:8px;margin-top:14px;}
  .overlay-actions .btn{flex:1;}

  .sync-label{font-size:12px;color:var(--sub);display:block;margin:0 0 4px;}
  .sync-input{
    width:100%;padding:11px;font-size:14px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);margin-bottom:12px;
  }
  .sync-input:focus{outline:2px solid var(--accent);}

  /* 실행 타이머 */
  .execute-timer{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:4px;}

  /* 아바타 반응 */
  .avatar-box{
    position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:10px 18px 10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.14);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    z-index:80;max-width:90vw;
  }
  .avatar-box.show{opacity:1;transform:translate(-50%,0);}
  .avatar-face{font-size:26px;flex-shrink:0;}
  .avatar-bubble{font-size:13.5px;color:var(--ink);font-weight:600;}
  @media (max-width:600px){ .avatar-box{bottom:10px;padding:8px 14px 8px 10px;} .avatar-bubble{font-size:12.5px;} }

  /* 루틴 프로젝트 */
  .routine-toggle{
    flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;cursor:pointer;
    padding:6px 9px;border-radius:6px;opacity:1;
  }
  .routine-toggle.active{opacity:1;background:var(--teal-soft);}
  .routine-reset-row{margin:10px 0 4px;}
  .routine-log{margin-top:16px;font-size:12.5px;color:var(--sub);}
  .routine-log-title{font-size:13px;font-weight:700;color:var(--teal);margin:0 0 6px;padding-top:12px;border-top:1px dashed var(--line);}
  .routine-log-row{padding:2px 0;}

  :root{--bg:#f4f6fb;--ink:#20283e;--sub:#69748b;--line:#e1e6f0;--accent:#635bda;--accent-soft:#eeedff;--purple:#635bda;--purple-soft:#eeedff;}
  body{background:radial-gradient(ellipse at top left,#ececff,transparent 55%),var(--bg);}
  .wrap{max-width:1280px;padding-top:32px;}
  .topbar{margin-bottom:26px;}
  .topbar h1{font-size:26px;letter-spacing:-1px;}
  .columns{grid-template-columns:minmax(0,1fr);}
  .columns.manager-open{grid-template-columns:minmax(0,1fr) minmax(300px,.55fr);}
  .col-card{padding:24px;border-radius:24px;box-shadow:0 12px 40px #29396b08;min-width:0;}
  .project-manager:not([open]){padding:16px 24px;}
  .project-manager summary{cursor:pointer;list-style:none;margin:0;user-select:none;}
  .project-manager[open] summary{margin-bottom:18px;}
  .summary-hint{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400;}
  .project-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .project-chip{border:1px solid var(--line);background:#fff;color:var(--sub);padding:10px 17px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;overflow-wrap:anywhere;max-width:100%;}
  .project-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px #635bda25;}
  .tabs{margin-top:22px;padding:6px;background:#f1f3f9;border:0;}
  .tab-btn{padding:12px 5px;}
  .tab-btn.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px #29396b10;}
  .execute-card{padding:22px 0 0;}
  .execute-task-text{font-size:clamp(24px,3vw,34px);letter-spacing:-.7px;margin:12px 0;}
  .execute-next{color:var(--sub);font-size:14px;margin:0 0 30px;overflow-wrap:anywhere;}
  .execute-path{font-size:14px;}
  .execute-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .act-btn{flex-direction:column;align-items:flex-start;gap:5px;padding:17px;transition:filter .15s,transform .15s;}
  .act-c,.act-f{grid-column:1 / -1;}
  .act-a{background:var(--accent);color:white;}
  .act-btn:hover,.btn:hover{filter:brightness(.97);}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  .task-list{gap:10px;overflow-x:auto;padding:5px 3px 16px;}
  .task-row{position:relative;padding:12px 8px;min-width:245px;transition:background .12s,border-color .12s;}
  .drag-handle{font-size:18px;padding:4px 7px;}
  .row-delete{opacity:.65;}
  .drop-inside{background:var(--accent-soft);border:2px solid var(--accent);}
  .drop-before:before,.drop-after:after{content:"";position:absolute;left:0;right:0;height:4px;background:var(--accent);border-radius:4px;z-index:2;}
  .drop-before:before{top:-7px;}.drop-after:after{bottom:-7px;}
  .task-row[data-drop-label] .task-text{padding-right:12px;}
  .task-row[data-drop-label]:not(.drop-after):after,.drop-after:before{content:attr(data-drop-label);position:absolute;right:8px;top:-13px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:5px;font-size:10px;z-index:3;pointer-events:none;}
  .proj-row{flex-wrap:wrap;gap:6px;padding:10px;}
  .proj-row .proj-name{text-align:left;cursor:pointer;overflow-wrap:anywhere;flex-basis:100px;}
  .overlay-box{box-shadow:0 24px 100px #20283e30;border-radius:24px;}
  @media(max-width:900px){.columns.manager-open{grid-template-columns:minmax(0,1fr);}.project-manager{grid-row:1;}}
  @media(max-width:520px){.wrap{padding:20px 12px 60px;}.col-card{padding:18px 14px;border-radius:18px;}.execute-actions{grid-template-columns:repeat(2,minmax(0,1fr));}.act-d,.act-e{grid-column:1 / -1;}.topbar-actions{gap:6px;}.topbar-actions .btn{font-size:11px;padding:9px;}.save-note{width:100%;}.act-btn{padding:14px;}}

  :root{--ui-width:1280px;--ui-space:1;}
  .wrap{max-width:var(--ui-width);container-type:inline-size;padding-top:calc(32px * var(--ui-space));}
  .topbar{margin-bottom:calc(26px * var(--ui-space));}
  .columns{gap:calc(16px * var(--ui-space));}
  .col-card{padding:calc(24px * var(--ui-space));}
  .project-manager:not([open]){padding:calc(16px * var(--ui-space)) calc(24px * var(--ui-space));}
  .tabs{margin-top:calc(22px * var(--ui-space));margin-bottom:calc(14px * var(--ui-space));}
  .tab-btn{padding:calc(12px * var(--ui-space)) 5px;}
  .project-chips{gap:calc(8px * var(--ui-space));margin-bottom:calc(18px * var(--ui-space));}
  .project-chip{padding:calc(10px * var(--ui-space)) 14px;}
  .task-list{gap:calc(10px * var(--ui-space));}
  .task-row{padding:calc(12px * var(--ui-space)) 8px;}
  .execute-card{padding-top:calc(22px * var(--ui-space));}
  .execute-task-text{margin:calc(12px * var(--ui-space)) 0;}
  .execute-next{margin-bottom:calc(30px * var(--ui-space));}
  .execute-actions{gap:calc(10px * var(--ui-space));}
  .act-btn{padding:calc(17px * var(--ui-space));gap:calc(5px * var(--ui-space));}
  .proj-row{padding:calc(10px * var(--ui-space));margin-bottom:calc(7px * var(--ui-space));}
  .view-settings{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;}
  .view-settings[hidden]{display:none;}
  #cloudSync [hidden]{display:none!important;}
  .view-settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .view-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .view-presets [aria-pressed="true"]{background:var(--accent);color:#fff;}
  .view-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;}
  .view-controls label{font-size:14px;font-weight:600;}
  .view-controls output{float:right;color:var(--accent);}
  .view-controls input{display:block;width:100%;margin:14px 0;accent-color:var(--accent);}
  .view-controls span{display:block;font-size:12px;font-weight:400;color:var(--sub);line-height:1.5;}
  @container(max-width:900px){.columns.manager-open{grid-template-columns:minmax(0,1fr);}.project-manager{grid-row:1;}}
  @media(max-width:520px){.col-card{padding:calc(18px * var(--ui-space)) calc(14px * var(--ui-space));}.act-btn{padding:calc(14px * var(--ui-space));}.view-controls{grid-template-columns:1fr;gap:18px;}}
  .tree-controls{display:flex;gap:6px;margin:8px 0;}
  .tree-controls .btn{padding:7px 10px;font-size:12px;}
  .tree-toggle{flex:0 0 24px;width:24px;height:28px;padding:0;border:0;border-radius:6px;background:var(--accent-soft);color:var(--accent);cursor:pointer;font-size:14px;}
  .tree-spacer{flex:0 0 24px;width:24px;}
  .tree-count{font-size:11px;color:var(--sub);white-space:nowrap;}
  #workspace,#workspace.manager-open{grid-template-columns:repeat(2,minmax(0,1fr));}
  #workspace>.project-manager{grid-column:1 / -1;grid-row:auto;}
  .task-pane{min-width:0;}
  .task-pane.focused{border-color:var(--accent);}
  .pane-label{font-size:13px;}
  .task-list{min-height:48px;}
  .task-list.drop-empty:after{content:"여기에 할 일 놓기";display:block;padding:8px;color:var(--accent);font-size:12px;border-top:3px solid var(--accent);}
  .task-pane .add-row{flex-wrap:wrap;}
  .task-pane .add-row input{flex-basis:160px;}
  .task-pane .act-btn{padding:calc(13px * var(--ui-space));}
  .task-pane .execute-task-text{font-size:clamp(22px,2vw,30px);}
  @container(max-width:700px){#workspace,#workspace.manager-open{grid-template-columns:minmax(0,1fr);}}
  .topbar{justify-content:flex-end;margin-bottom:8px;}
  .topbar-actions{justify-content:flex-end;}
  #workspace.single-pane{grid-template-columns:minmax(0,1fr);}
  #rightPane[hidden]{display:none!important;}
  .settings-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
  .panel-mode{display:flex;gap:12px;align-items:center;margin:16px 0;}
  .panel-mode select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}
  #viewSettingsBtn{font-size:20px;line-height:1;}
  #viewSettingsBtn[data-attention="true"]{color:#b45309;box-shadow:0 0 0 2px #fbbf24;}

  function syncPaneTimers(){
    var running=new Set();

  function applyViewSettings(){
    var hex=viewSettings.background.slice(1),rgb=[0,2,4].map(function(i){return parseInt(hex.slice(i,i+2),16);});

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function formatTs(ts){

    node.status = status;
    node.completedAt = Date.now();

  // Completion events are immutable snapshots; repeat routines get fresh event IDs.
  function completionSnapshot(project){
    var result = [];
    (function walk(nodes, path, ids){
      nodes.forEach(function(n){
        result.push({node:n, id:n.id, status:n.status, path:path.slice(), ancestors:ids.slice()});
        walk(n.children, path.concat(n.text), ids.concat(n.id));
      });
    })(project.tasks, [], []);
    return result;
  }
  function recordCompletions(project, before){
    var previous = {};
    before.forEach(function(entry){ previous[entry.id] = entry.status; });
    var changed = completionSnapshot(project).filter(function(entry){
      return previous[entry.id] === "pending" && entry.node.status !== "pending";
    });
    var leaves = changed.filter(function(entry){return !entry.node.children.length;});
    if(leaves.length){
      var at=Math.max.apply(null,leaves.map(function(entry){return entry.node.completedAt||0;}));
      var gap=lastCompletionAt===null?null:at-lastCompletionAt;
      changed.forEach(function(entry){entry.node.completionTimeMode="gap";entry.node.completionGapMs=null;playTimers.delete(entry.id);});
      if(leaves.length===1&&leaves[0].node.status==="done"&&gap>0&&gap<7200000)leaves[0].node.completionGapMs=gap;
      lastCompletionAt=at;
    }
    var records = leaves.map(function(entry){
      var n = entry.node;
      return {event:{id:typeof crypto.randomUUID === "function" ? crypto.randomUUID() : uid()+uid(),
        projectId:project.id, projectName:project.name, taskId:n.id, text:n.text,
        completedAt:n.completedAt, status:n.status, path:entry.path,
        milestones:[], nonProject:!!n.nonProject}, sentAt:null};
    });
    changed.filter(function(entry){return entry.node.children.length;}).reverse().forEach(function(entry){
      for(var i=leaves.length-1;i>=0;i--){
        if(leaves[i].ancestors.indexOf(entry.id) < 0) continue;
        var abandoned = (function hasAbandoned(n){return n.status === "gaveup" || n.children.some(hasAbandoned);})(entry.node);
        records[i].event.milestones.push(entry.path.concat(entry.node.text).join(" › ") + " 마무리" + (abandoned ? " (포기한 항목 포함)" : ""));
        break;
      }
    });
    state.integrationEvents = (state.integrationEvents || []).concat(records);
  }

  async function selftalkieRequest(path, body){
    if(window.parent!==window && window.parent.selftalkieCloud){
      if(window.parent.SELFTALKIE_DESKTOP){
        var result=await window.parent.pywebview.api.jjogaera_embedded_request(path,body||null);
        if(!result.ok)throw Error(result.error||"Task Note 전송 실패");
        return result;
      }
      return window.parent.selftalkieCloud.receiveNotes(path,body);
    }
    if(!window.jjogaeraCloudSend)throw Error("Google 로그인과 데이터 연결을 먼저 완료해주세요.");
    return window.jjogaeraCloudSend(path,body);
  }
  document.getElementById("selftalkieSendBtn").addEventListener("click",async function(){
    if(selftalkieSending) return;
    var pending = (state.integrationEvents || []).filter(function(e){return !e.sentAt;});
    if(!pending.length)return;
    selftalkieSending=true;renderSelftalkie();
    var sent=0;
    try{
      for(var i=0;i<pending.length;i+=100){
        var batch=pending.slice(i,i+100);
        var result=await selftalkieRequest("/events",{events:batch.map(function(e){return e.event;})});
        if(!Array.isArray(result.acceptedIds) || batch.some(function(e){return result.acceptedIds.indexOf(e.event.id)<0;})) throw new Error("수신 확인이 불완전합니다. 대기 기록을 다시 보내주세요.");
        var ids=batch.map(function(e){return e.event.id;});
        (state.integrationEvents || []).forEach(function(e){if(ids.indexOf(e.event.id)>=0)e.sentAt=Date.now();});
        save();sent+=batch.length;
      }
      showAvatar("✓", "SelfTalkie에 " + sent + "건 기록했습니다.");
      showAvatar("✓",sent+"건을 Task Note에 기록했습니다.");
    }catch(e){showAvatar("!",(sent ? sent+"건 전송 완료. " : "")+e.message);}
    finally{selftalkieSending=false;renderSelftalkie();}
  });

  // ---------- 렌더 ----------
  function renderAll(){
    var original=currentPane;
    paneContexts.forEach(function(p,i){
      if(!state.projects.some(function(x){return x.id===p.projectId;}))p.projectId=(state.projects[i] || state.projects[0] || {}).id || null;
    });
    syncPaneTimers();
    renderSelftalkie();
    paneContexts.forEach(function(p){
      bindPane(p);
      p.root.querySelectorAll(".tab-btn").forEach(function(b){b.classList.toggle("active",b.dataset.tab===p.tab);b.setAttribute("aria-pressed",String(b.dataset.tab===p.tab));});
      p.root.querySelector(".segment-track").dataset.active=p.tab;
      ["list","execute","history"].forEach(function(tab){paneElement(p,"panel-"+tab).classList.toggle("active",p.tab===tab);});
      renderActiveHead();renderTaskList();renderExecute();
      if(p.tab==="history")renderHistory();else{
        if(p.historyObserver){p.historyObserver.disconnect();p.historyObserver=null;}
        if(p.historyUI){p.historyUI.limit=30;p.historyUI.scroll=0;paneElement(p,"historyView").replaceChildren();}
      }
    });
    focusPane(original);
    renderProjects();savePaneLayout();save();
  }

  window.jjogaeraWidget={
    tasks:function(){
      var seen={};return paneContexts.map(function(pane){
        var project=state.projects.find(function(p){return p.id===pane.projectId;});
        if(!project||seen[project.id])return null;seen[project.id]=true;
        var task=findActionable(project.tasks),queue=[];
        (function collect(nodes){nodes.forEach(function(n){if(n.status!=="pending")return;if(n.children.length)collect(n.children);else queue.push(n);});})(project.tasks);
        return {nextText:queue[1]?queue[1].text:null,projectId:project.id,projectName:project.name,taskId:task?task.id:null,text:task?task.text:"완료한 프로젝트",pane:paneContexts.indexOf(pane)};
      }).filter(Boolean);
    },
    act:function(projectId,taskId,action){
      if(["done","postpone"].indexOf(action)<0)return false;
      var pane=paneContexts.find(function(p){return p.projectId===projectId;});
      var project=state.projects.find(function(p){return p.id===projectId;});
      var task=project&&findActionable(project.tasks);
      if(!pane||!task||task.id!==taskId)return false;
      var previous=currentPane;focusPane(pane);
      try{if(action==="done")resolveCurrent(task,"done");else postpone(task);}finally{focusPane(previous);}
      return true;
    }
  };

  // Chat is another view over these same project tasks, never a second task store.
  function chatLocate(id){
    for(var p of state.projects){var loc=locate(p.tasks,id);if(loc)return {project:p,loc:loc,task:loc.arr[loc.idx]};}
    return null;
  }
  function chatProject(id){
    var project=state.projects.find(function(p){return p.id===id;});
    if(project)return project;
    project=state.projects.find(function(p){return p.id==='starter_project_0'||p.id==='chat_default_project';});
    if(!project){project={id:'chat_default_project',name:'기본프로젝트',tasks:[],inserts:[],isRoutine:false,routineLog:[]};state.projects.push(project);}
    return project;
  }
  window.jjogaeraChat={
    projects:function(){return state.projects.map(function(p){return {id:p.id,name:p.name};});},
    get:function(id){var found=chatLocate(id);return found?structuredClone({task:found.task,project:{id:found.project.id,name:found.project.name}}):null;},
    create:function(texts,projectId,key){
      if(!Array.isArray(texts)||!texts.length||texts.length>100)throw Error('한 번에 1~100개의 할 일을 보낼 수 있어요.');
      var project=chatProject(projectId),result=[];
      texts.forEach(function(text,i){
        text=String(text).trim();if(!text)throw Error('할 일을 입력해주세요.');
        var id=key?'chat_'+String(key).replace(/[^A-Za-z0-9_-]/g,'').slice(0,100)+'_'+i:null;
        var old=id&&chatLocate(id);if(old){result.push(structuredClone(old.task));return;}
        var n=newNode(text);if(id)n.id=id;project.tasks.push(n);result.push(structuredClone(n));
      });
      save();renderAll();return result;
    },
    act:function(id,action,payload){
      var found=chatLocate(id);if(!found)throw Error('삭제된 할 일이에요.');
      var p=found.project,n=found.task,data=payload||{},before=completionSnapshot(p);
      var reopen=function(target){target.status='pending';target.completedAt=null;target.completionGapMs=null;target.children.forEach(reopen);};
      var reopenAncestors=function(){(function walk(nodes,ancestors){for(var node of nodes){if(node.id===id){ancestors.forEach(function(a){a.status='pending';a.completedAt=null;a.completionGapMs=null;});return true;}if(walk(node.children,ancestors.concat(node)))return true;}return false;})(p.tasks,[]);};
      if(action==='toggle'){
        if(data.checked){var at=Date.now();(function done(t){if(t.status==='pending'){t.status='done';t.completedAt=at;pauseTimerNode(t);}t.children.forEach(done);})(n);}
        else{reopen(n);reopenAncestors();}
        sweep(p.tasks);recordCompletions(p,before);
      }else if(action==='project'){
        var destination=state.projects.find(function(project){return project.id===data.projectId;});
        if(!destination)throw Error('옮길 프로젝트가 삭제됐어요. 다시 선택해주세요.');
        if(destination===p)return {ok:true};
        pauseGlobalTimer();found.loc.arr.splice(found.loc.idx,1);destination.tasks.push(n);
        (function transfer(task){var oldKey=p.id+':'+task.id,newKey=destination.id+':'+task.id;if(collapsedTrees[oldKey])collapsedTrees[newKey]=true;delete collapsedTrees[oldKey];task.children.forEach(transfer);})(n);
        saveCollapsedTrees();sweep(p.tasks);sweep(destination.tasks);
      }else if(action==='move'){
        var direction=data.direction===-1?-1:data.direction===1?1:0;
        var at=found.loc.idx,next=at+direction;
        if(!direction||!found.loc.owner||next<0||next>=found.loc.arr.length)return {ok:false};
        found.loc.arr.splice(at,1);found.loc.arr.splice(next,0,n);
      }else if(action==='rename'){
        var text=String(data.text||'').trim();if(!text)throw Error('할 일을 입력해주세요.');n.text=text;
      }else if(action==='split'||action==='add'){
        var texts=action==='split'?data.texts:[data.text];
        if(!Array.isArray(texts)||!texts.length||texts.length>100||texts.some(function(t){return !String(t||'').trim();}))throw Error('하위 할 일을 입력해주세요.');
        n.status='pending';n.completedAt=null;n.completionGapMs=null;pauseTimerNode(n);reopenAncestors();
        texts.forEach(function(t){n.children.push(newNode(String(t).trim()));});
      }else if(action==='delete'){
        var undoProject=structuredClone(p),position=state.projects.indexOf(p);
        found.loc.arr.splice(found.loc.idx,1);sweep(p.tasks);save();renderAll();
        offerProjectUndo(undoProject,projectVersion(p),position);return {ok:true};
      }else throw Error('지원하지 않는 할 일 동작이에요.');
      save();renderAll();return {ok:true};
    }
  };

  window.jjogaera={
    starterState:starterState,
    getState:function(){return JSON.parse(JSON.stringify(state));},
    applyState:function(next){
      var focused=document.activeElement;
      var editing=focused && focused.classList.contains("task-text") ? {id:focused.closest(".task-row").dataset.taskId,pane:focused.closest(".task-pane"),start:focused.selectionStart,end:focused.selectionEnd} : null;
      if(state.cloudOwner!==next.cloudOwner){lastCompletionAt=null;playTimers.clear();}
      state=next;clearLegacyRunning();
      renderAll();
      if(editing){
        var row=Array.from(editing.pane.querySelectorAll(".task-row")).find(function(r){return r.dataset.taskId===editing.id;});
        var input=row && row.querySelector(".task-text");
        if(input){input.focus({preventScroll:true});input.setSelectionRange(editing.start,editing.end);}
      }
    }
  };
  load();
  document.getElementById("workspace").addEventListener("input",function(){state.starterDemo=false;},true);
  initializePanes();
  if(!state.projects.length) projectManager.open = true;
  document.getElementById("workspace").classList.toggle("manager-open", projectManager.open);
  clearLegacyRunning();
  finalizeAllRunning();
  state.projects.forEach(function(p){ sweep(p.tasks); });
  renderAll();
  save();

  setInterval(function(){
    syncPaneTimers();
    paneContexts.forEach(function(p){
      var project=state.projects.find(function(x){return x.id===p.projectId;});
      var node=project && findActionable(project.tasks);
      var disp=p.root.querySelector(".execute-timer");
      if(node && disp)disp.textContent="⏱ "+formatDuration(playElapsed(node));
    });
  },1000);

})();
